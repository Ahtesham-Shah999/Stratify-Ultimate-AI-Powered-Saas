<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth System - Login & Signup</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .header p {
      font-size: 14px;
      opacity: 0.9;
    }
    .content {
      padding: 40px;
    }
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 16px;
      font-weight: 600;
      color: #999;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
    }
    .tab.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }
    .form-section {
      display: none;
    }
    .form-section.active {
      display: block;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 500;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    input:disabled {
      background: #f5f5f5;
      cursor: not-allowed;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:active:not(:disabled) {
      transform: translateY(0);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .secondary-btn {
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
    }
    .secondary-btn:hover:not(:disabled) {
      background: #f0f0ff;
    }
    .link-btn {
      background: none;
      color: #667eea;
      text-decoration: underline;
      font-size: 14px;
      padding: 10px 0;
      margin-top: 15px;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert.show {
      display: block;
      animation: slideDown 0.3s;
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .alert.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .alert.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .step-indicator {
      background: #f0f0ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #667eea;
      text-align: center;
      font-weight: 500;
    }
    .hidden {
      display: none !important;
    }
    .otp-input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .otp-input {
      width: 50px;
      height: 50px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔐 Welcome</h1>
      <p>Secure Authentication System</p>
    </div>

    <div class="content">
      <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <div id="login-section" class="form-section active">
        <div id="login-alert" class="alert"></div>
        
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter your email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password">
        </div>
        <button onclick="handleLogin()">Login</button>
        <button class="link-btn" onclick="showForgotPassword()">Forgot Password?</button>
      </div>

      <!-- SIGNUP FORM -->
      <div id="signup-section" class="form-section">
        <div id="signup-alert" class="alert"></div>
        
        <!-- Step 1: Enter Email and Request OTP -->
        <div id="signup-step1">
          <div class="step-indicator">Step 1: Enter your email to receive OTP</div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email" placeholder="Enter your email">
          </div>
          <button onclick="sendSignupOTP()">Send OTP</button>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="signup-step2" class="hidden">
          <div class="step-indicator">Step 2: Enter the OTP sent to your email</div>
          <div class="form-group">
            <label>Enter OTP</label>
            <div class="otp-input-group">
              <input type="text" maxlength="1" class="otp-input" id="otp1" oninput="moveToNext(this, 'otp2')">
              <input type="text" maxlength="1" class="otp-input" id="otp2" oninput="moveToNext(this, 'otp3')">
              <input type="text" maxlength="1" class="otp-input" id="otp3" oninput="moveToNext(this, 'otp4')">
              <input type="text" maxlength="1" class="otp-input" id="otp4" oninput="moveToNext(this, 'otp5')">
              <input type="text" maxlength="1" class="otp-input" id="otp5" oninput="moveToNext(this, 'otp6')">
              <input type="text" maxlength="1" class="otp-input" id="otp6">
            </div>
          </div>
          <button onclick="verifySignupOTP()">Verify OTP</button>
          <button class="secondary-btn" onclick="backToStep1()">Back</button>
        </div>

        <!-- Step 3: Complete Registration -->
        <div id="signup-step3" class="hidden">
          <div class="step-indicator">Step 3: Complete your registration</div>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="signup-username" placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="signup-email-confirm" disabled>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="signup-password" placeholder="Create a password">
          </div>
          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="signup-password-confirm" placeholder="Confirm your password">
          </div>
          <button onclick="completeSignup()">Create Account</button>
        </div>
      </div>

      <!-- FORGOT PASSWORD FORM -->
      <div id="forgot-section" class="form-section">
        <div id="forgot-alert" class="alert"></div>
        
        <!-- Step 1: Enter Email for Reset -->
        <div id="forgot-step1">
          <div class="step-indicator">Step 1: Enter your email to receive reset OTP</div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="forgot-email" placeholder="Enter your email">
          </div>
          <button onclick="sendResetOTP()">Send Reset OTP</button>
          <button class="secondary-btn" onclick="switchTab('login')">Back to Login</button>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="forgot-step2" class="hidden">
          <div class="step-indicator">Step 2: Enter the OTP sent to your email</div>
          <div class="form-group">
            <label>Enter OTP</label>
            <div class="otp-input-group">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp1" oninput="moveToNext(this, 'reset-otp2')">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp2" oninput="moveToNext(this, 'reset-otp3')">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp3" oninput="moveToNext(this, 'reset-otp4')">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp4" oninput="moveToNext(this, 'reset-otp5')">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp5" oninput="moveToNext(this, 'reset-otp6')">
              <input type="text" maxlength="1" class="otp-input" id="reset-otp6">
            </div>
          </div>
          <button onclick="verifyResetOTP()">Verify OTP</button>
          <button class="secondary-btn" onclick="backToForgotStep1()">Back</button>
        </div>

        <!-- Step 3: Enter New Password (shown after OTP verified) -->
        <div id="forgot-step3" class="hidden">
          <div class="step-indicator">Step 3: Set your new password</div>
          <div class="form-group">
            <label>New Password</label>
            <input type="password" id="reset-new-password" placeholder="Enter new password">
          </div>
          <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" id="reset-confirm-password" placeholder="Confirm new password">
          </div>
          <button onclick="completePasswordReset()">Reset Password</button>
          <button class="secondary-btn" onclick="backToForgotStep2()">Back</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:4000';
    let signupEmail = '';
    let forgotEmail = '';

    // Tab Switching
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      
      if (tab === 'login') {
        document.querySelector('.tab:nth-child(1)').classList.add('active');
        document.getElementById('login-section').classList.add('active');
      } else if (tab === 'signup') {
        document.querySelector('.tab:nth-child(2)').classList.add('active');
        document.getElementById('signup-section').classList.add('active');
        resetSignupForm();
      }
    }

    function showForgotPassword() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
      document.getElementById('forgot-section').classList.add('active');
      resetForgotForm();
    }

    // Alert Functions
    function showAlert(elementId, message, type) {
      const alert = document.getElementById(elementId);
      alert.className = `alert show ${type}`;
      alert.textContent = message;
      setTimeout(() => alert.classList.remove('show'), 5000);
    }

    // OTP Input Navigation
    function moveToNext(current, nextId) {
      if (current.value.length === 1) {
        const next = document.getElementById(nextId);
        if (next) next.focus();
      }
    }

    function getOTP(prefix) {
      let otp = '';
      for (let i = 1; i <= 6; i++) {
        otp += document.getElementById(`${prefix}${i}`).value;
      }
      return otp;
    }

    function clearOTP(prefix) {
      for (let i = 1; i <= 6; i++) {
        document.getElementById(`${prefix}${i}`).value = '';
      }
    }

    // ===== LOGIN FLOW =====
    async function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showAlert('login-alert', 'Please fill in all fields', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/user/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          showAlert('login-alert', 'Login successful! Welcome back.', 'success');
          console.log('Login response:', data);
          // Redirect or save token here
        } else {
          showAlert('login-alert', data.error || 'Login failed', 'error');
        }
      } catch (err) {
        showAlert('login-alert', 'Connection error. Please try again.', 'error');
      }
    }

    // ===== SIGNUP FLOW =====
    function resetSignupForm() {
      document.getElementById('signup-step1').classList.remove('hidden');
      document.getElementById('signup-step2').classList.add('hidden');
      document.getElementById('signup-step3').classList.add('hidden');
      document.getElementById('signup-email').value = '';
      clearOTP('otp');
    }

    // Step 1: Send OTP
    async function sendSignupOTP() {
      const email = document.getElementById('signup-email').value.trim();
      
      if (!email) {
        showAlert('signup-alert', 'Please enter your email', 'error');
        return;
      }

      try {
        const Subject = 'Welcome To Stratify - Verify Your Email';
        const res = await fetch(`${API_BASE}/api/auth/send-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, Subject })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          signupEmail = email;
          showAlert('signup-alert', 'OTP sent to your email!', 'success');
          document.getElementById('signup-step1').classList.add('hidden');
          document.getElementById('signup-step2').classList.remove('hidden');
          document.getElementById('otp1').focus();
        } else {
          showAlert('signup-alert', data.message || 'Failed to send OTP', 'error');
        }
      } catch (err) {
        showAlert('signup-alert', 'Connection error. Please try again.', 'error');
      }
    }

    // Step 2: Verify OTP
    async function verifySignupOTP() {
      const otp = getOTP('otp');
      
      if (otp.length !== 6) {
        showAlert('signup-alert', 'Please enter complete OTP', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: signupEmail, otp })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          showAlert('signup-alert', 'OTP verified! Complete your registration.', 'success');
          document.getElementById('signup-step2').classList.add('hidden');
          document.getElementById('signup-step3').classList.remove('hidden');
          document.getElementById('signup-email-confirm').value = signupEmail;
        } else {
          showAlert('signup-alert', data.message || 'Invalid OTP', 'error');
        }
      } catch (err) {
        showAlert('signup-alert', 'Connection error. Please try again.', 'error');
      }
    }

    // Step 3: Complete Signup (TRADER role only)
    async function completeSignup() {
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const password_confirm = document.getElementById('signup-password-confirm').value;

      if (!username || !password || !password_confirm) {
        showAlert('signup-alert', 'Please fill in all fields', 'error');
        return;
      }

      if (password !== password_confirm) {
        showAlert('signup-alert', 'Passwords do not match', 'error');
        return;
      }

      if (password.length < 6) {
        showAlert('signup-alert', 'Password must be at least 6 characters', 'error');
        return;
      }

      try {
        const payload = { 
          username, 
          email: signupEmail, 
          password,
          role: 'TRADER'
        };
        
        console.log('Sending signup request:', payload);
        
        const res = await fetch(`${API_BASE}/api/user/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        console.log('Response status:', res.status);
        
        const data = await res.json();
        console.log('Response data:', data);
        
        if (res.ok) {
          showAlert('signup-alert', 'Account created successfully!', 'success');
          setTimeout(() => {
            switchTab('login');
            document.getElementById('login-email').value = signupEmail;
          }, 2000);
        } else {
          const errorMsg = data.message || data.error || JSON.stringify(data);
          showAlert('signup-alert', `Signup failed: ${errorMsg}`, 'error');
          console.error('Signup error:', data);
        }
      } catch (err) {
        console.error('Signup exception:', err);
        showAlert('signup-alert', `Connection error: ${err.message}`, 'error');
      }
    }

    function backToStep1() {
      document.getElementById('signup-step2').classList.add('hidden');
      document.getElementById('signup-step1').classList.remove('hidden');
      clearOTP('otp');
    }

    // ===== FORGOT PASSWORD FLOW =====
    function resetForgotForm() {
      document.getElementById('forgot-step1').classList.remove('hidden');
      document.getElementById('forgot-step2').classList.add('hidden');
      document.getElementById('forgot-step3').classList.add('hidden');
      document.getElementById('forgot-email').value = '';
      clearOTP('reset-otp');
    }

    // Step 1: Send Reset OTP
    async function sendResetOTP() {
      const email = document.getElementById('forgot-email').value.trim();
      
      if (!email) {
        showAlert('forgot-alert', 'Please enter your email', 'error');
        return;
      }

      try {
        alert("hi")
        const res = await fetch(`${API_BASE}/api/user/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          forgotEmail = email;
          showAlert('forgot-alert', 'Reset OTP sent to your email!', 'success');
          document.getElementById('forgot-step1').classList.add('hidden');
          document.getElementById('forgot-step2').classList.remove('hidden');
          document.getElementById('reset-otp1').focus();
        } else {
          showAlert('forgot-alert', data.error || data.message || 'Failed to send OTP', 'error');
        }
      } catch (err) {
        showAlert('forgot-alert', 'Connection error. Please try again.', 'error');
      }
    }

    // Step 2: Verify Reset OTP
    async function verifyResetOTP() {
      const otp = getOTP('reset-otp');

      if (otp.length !== 6) {
        showAlert('forgot-alert', 'Please enter complete OTP', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/auth/verify-otp`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: forgotEmail, otp })
        });

        const data = await res.json();

        if (res.ok) {
          showAlert('forgot-alert', 'OTP verified! Set your new password.', 'success');
          document.getElementById('forgot-step2').classList.add('hidden');
          document.getElementById('forgot-step3').classList.remove('hidden');
          clearOTP('reset-otp');
          document.getElementById('reset-new-password').focus();
        } else {
          showAlert('forgot-alert', data.message || 'Invalid OTP', 'error');
        }
      } catch (err) {
        showAlert('forgot-alert', 'Connection error. Please try again.', 'error');
      }
    }

    // Step 3: Reset Password after OTP verified
    async function completePasswordReset() {
      const newPassword = document.getElementById('reset-new-password').value;
      const confirmPassword = document.getElementById('reset-confirm-password').value;

      if (!newPassword || !confirmPassword) {
        showAlert('forgot-alert', 'Please fill in all fields', 'error');
        return;
      }

      if (newPassword !== confirmPassword) {
        showAlert('forgot-alert', 'Passwords do not match', 'error');
        return;
      }

      if (newPassword.length < 6) {
        showAlert('forgot-alert', 'Password must be at least 6 characters', 'error');
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/api/user/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            email: forgotEmail, 
            newPassword 
          })
        });

        const data = await res.json();

        if (res.ok) {
          showAlert('forgot-alert', 'Password reset successful!', 'success');
          setTimeout(() => {
            switchTab('login');
            document.getElementById('login-email').value = forgotEmail;
          }, 2000);
        } else {
          showAlert('forgot-alert', data.error || data.message || 'Password reset failed', 'error');
        }
      } catch (err) {
        showAlert('forgot-alert', 'Connection error. Please try again.', 'error');
      }
    }

    function backToForgotStep1() {
      document.getElementById('forgot-step2').classList.add('hidden');
      document.getElementById('forgot-step1').classList.remove('hidden');
      clearOTP('reset-otp');
    }

    function backToForgotStep2() {
      document.getElementById('forgot-step3').classList.add('hidden');
      document.getElementById('forgot-step2').classList.remove('hidden');
      document.getElementById('reset-new-password').value = '';
      document.getElementById('reset-confirm-password').value = '';
    }
  </script>
</body>
</html>
